name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            uv sync --python 3.12
          else
            uv sync --frozen --python 3.12
          fi

      - name: Run ruff linter
        run: uv run ruff check --output-format=github .

      - name: Run ruff formatter check
        run: uv run ruff format --check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            uv sync --python 3.12
          else
            uv sync --frozen --python 3.12
          fi

      - name: Run type checker
        run: uv run mypy omnillm/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            uv sync --python ${{ matrix.python-version }}
          else
            uv sync --frozen --python ${{ matrix.python-version }}
          fi

      - name: Run tests with coverage
        run: uv run pytest --cov=omnillm --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage report
        if: matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  build-check:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke-test the wheel in a clean environment (no extras)
        run: |
          uv venv /tmp/smoke --python 3.12
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -I -c "import omnillm; print('omnillm', omnillm.__version__)"
          /tmp/smoke/bin/omnillm --help > /dev/null
          /tmp/smoke/bin/omnillm fit llama-3.1-8b --offline --json > /dev/null
          # The headline command must read real Hugging Face data from a bare install (tolerate a Hub outage).
          /tmp/smoke/bin/omnillm fit bartowski/SmolLM2-135M-Instruct-GGUF --json > fit.json
          /tmp/smoke/bin/python -I -c "import json; d = json.load(open('fit.json')); n = ' '.join(d['notes']); assert d['source'] == 'huggingface-gguf' or 'Cannot reach Hugging Face' in n, (d['source'], n); print('fit source:', d['source'])"

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: omni-local-llm:latest
